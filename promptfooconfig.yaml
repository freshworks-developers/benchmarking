# Promptfoo config for Freshworks app benchmarking.
# Run: promptfoo eval (requires promptfoo installed: npm install -g promptfoo)
# The provider runs bin/eval and asserts on the result JSON.

description: Freshworks Platform 3.0 app evaluation

providers:
  - exec: python3 scripts/promptfoo_provider.py

prompts:
  - "TEST002-generated"

tests:
  - vars:
      app_id: TEST002-generated
    assert:
      - type: is-json
      - type: javascript
        value: |
          (function() {
            const o = typeof output === 'string' ? JSON.parse(output) : output;
            if (o.error) return { pass: false, score: 0, reason: o.error };
            const score = o.score && o.score.total_score != null ? o.score.total_score : 0;
            const pass = o.validation && o.validation.success;
            return { pass: pass && score >= 60, score: score / 100, reason: `score=${score} pass=${pass}` };
          })()
